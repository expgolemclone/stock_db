[project]
name = "stock-db"
version = "0.1.0"
description = "Price ingestion (Stooq/Yahoo) and remaining Python helpers for the stock_db EDINET XBRL platform"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28,<3",
    "truststore>=0.9,<1",
    "brotli>=1.1,<2",
    "pysocks>=1.7,<2",
    "beautifulsoup4>=4.14.3,<5",
    "pillow>=11.3,<12",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "playwright>=1.52,<2",
]

[project.scripts]
generate-validation-site-list = "stock_db.cli.generate_validation_site_list:main"
report-edinet-progress = "stock_db.cli.report_edinet_progress:main"
scrape-stooq-prices = "stock_db.cli.scrape_stooq_prices:main"
scrape-yahoo-finance-prices = "stock_db.cli.scrape_yahoo_finance_prices:main"
refresh-prices = "stock_db.cli.refresh_prices:main"
plot-xbrl-pl-trends = "stock_db.cli.plot_xbrl_pl_trends:main"
purge-irbank-financials = "stock_db.cli.purge_irbank_financials:main"
seed-edinet-code-list = "stock_db.cli.seed_edinet_code_list:main"
scheduled-refresh-prices = "stock_db.cli.scheduled_refresh_prices:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_db"]
